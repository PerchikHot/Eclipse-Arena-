name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eclipse-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo "Android sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Restore permanent development signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          if [ -f .github/eclipsearena-debug.keystore.b64 ]; then
            base64 --decode .github/eclipsearena-debug.keystore.b64 > "$RUNNER_TEMP/eclipsearena-debug.keystore"
          else
            keytool -genkeypair -noprompt -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore "$RUNNER_TEMP/eclipsearena-debug.keystore" -storepass android -keypass android -dname "CN=Eclipse Arena Development,O=Eclipse Arena,C=US"
            base64 -w0 "$RUNNER_TEMP/eclipsearena-debug.keystore" > .github/eclipsearena-debug.keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/eclipsearena-debug.keystore.b64
            git commit -m "Persist prototype debug signing key for APK upgrades"
            git push origin HEAD:main
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/eclipsearena-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Generate and verify Veyrion katana launcher artwork
        run: |
          python3 -m pip install --quiet Pillow
          python3 tools/build_icons.py
          python3 tools/build_icons.py --verify
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Run combat rules smoke tests
        run: timeout 90s godot --headless --verbose --path . --script res://tests/combat_rules_smoke.gd
      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/EclipseArena-debug.apk
      - name: Verify Android package includes launcher artwork
        run: |
          test -s build/EclipseArena-debug.apk
          unzip -l build/EclipseArena-debug.apk | grep -E "res/mipmap|res/drawable" >/dev/null
      - name: Verify APK certificate, package and upgrade version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=build/EclipseArena-debug.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --print-certs "$APK"
          get_cert() {
            "$APKSIGNER" verify --print-certs "$1" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1
          }
          get_package() {
            "$AAPT" dump badging "$1" | grep '^package:' | head -n 1
          }
          NEW_CERT="$(get_cert "$APK")"
          NEW_PACKAGE="$(get_package "$APK")"
          test -n "$NEW_CERT" && test -n "$NEW_PACKAGE"
          if gh release view eclipse-arena-android --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/previous-eclipse"
            gh release download eclipse-arena-android --repo "$GITHUB_REPOSITORY" \
              --pattern 'EclipseArena-debug.apk' --dir "$RUNNER_TEMP/previous-eclipse"
            OLD="$RUNNER_TEMP/previous-eclipse/EclipseArena-debug.apk"
            test -s "$OLD"
            OLD_CERT="$(get_cert "$OLD")"
            OLD_PACKAGE="$(get_package "$OLD")"
            test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT" || {
              echo "::error::Android signing certificate SHA-256 changed; in-place update unsafe"; exit 1;
            }
            OLD_ID="$(echo "$OLD_PACKAGE" | grep -o "name='[^']*'" | head -n 1)"
            NEW_ID="$(echo "$NEW_PACKAGE" | grep -o "name='[^']*'" | head -n 1)"
            test "$OLD_ID" = "$NEW_ID" || {
              echo "::error::Android application ID changed"; exit 1;
            }
            OLD_CODE="$(echo "$OLD_PACKAGE" | grep -o "versionCode='[0-9]*'" | cut -d "'" -f 2)"
            NEW_CODE="$(echo "$NEW_PACKAGE" | grep -o "versionCode='[0-9]*'" | cut -d "'" -f 2)"
            test -n "$OLD_CODE" && test -n "$NEW_CODE" && test "$NEW_CODE" -gt "$OLD_CODE" || {
              echo "::error::Android versionCode must increase ($OLD_CODE -> $NEW_CODE)"; exit 1;
            }
            echo "Upgrade verified: same package, same certificate SHA-256, $OLD_CODE -> $NEW_CODE"
          else
            echo "No previous Android release; checking current signature only."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: EclipseArena-Android-debug
          path: build/EclipseArena-debug.apk
          if-no-files-found: error
      - name: Publish APK for direct All Hub installation
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view eclipse-arena-android --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create eclipse-arena-android --repo "$GITHUB_REPOSITORY" \
              --title "Eclipse Arena — Android testing" \
              --notes "Отладочная APK-сборка для установки через All Hub. Подписана существующим debug-ключом." --latest=false
          gh release upload eclipse-arena-android build/EclipseArena-debug.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          VERSION="$(sed -n 's/^version\/name="\([^"]*\)"/\1/p' export_presets.cfg | head -n 1)"
          test -n "$VERSION"
          gh release edit eclipse-arena-android --repo "$GITHUB_REPOSITORY" \
            --notes "$(printf '%s\nVersion: %s\n' 'Отладочная APK-сборка Eclipse Arena. Подписана существующим debug-ключом.' "$VERSION")"
